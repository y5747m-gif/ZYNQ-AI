<svg xmlns="http://www.w3.org/2000/svg" class="zy-bot-svg bot-talk" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">فقاعة العربية</title><desc id="desc">فقاعة كلام عربية مع نقاط حديث متحركة.</desc>
<style>
.bot-talk .motion{animation:zy-float 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bot-talk .delay{animation-delay:.6s}.bot-talk .spin{animation:zy-spin 5s linear infinite;transform-origin:256px 256px}
@keyframes zy-float{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-12px);opacity:1}}
@keyframes zy-spin{to{transform:rotate(360deg)}}
@keyframes zy-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(210px)}}
@keyframes zy-ring{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes zy-dots{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
@keyframes zy-sleep{0%,100%{opacity:.4;transform:translate(0,0)}50%{opacity:1;transform:translate(10px,-20px)}}
.bot-talk .motion{animation-name:zy-dots}
@media(prefers-reduced-motion:reduce){.bot-talk .motion,.bot-talk .spin{animation:none!important}}
</style><path d="M110 140h292v205H245l-65 61v-61h-70z" fill="#151025" stroke="#a878ff" stroke-width="8" stroke-linejoin="round"/><text x="256" y="235" text-anchor="middle" fill="#eeeaff" font-size="54" font-family="sans-serif" direction="rtl">أهلًا بك</text><g class="motion" fill="#5fd4ff"><circle cx="216" cy="285" r="9"/><circle cx="256" cy="285" r="9"/><circle cx="296" cy="285" r="9"/></g></svg>