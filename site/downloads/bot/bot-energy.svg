<svg xmlns="http://www.w3.org/2000/svg" class="zy-bot-svg bot-energy" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">طاقة البوت</title><desc id="desc">برق ذهبي نابض داخل حلقة بنفسجية.</desc>
<style>
.bot-energy .motion{animation:zy-float 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bot-energy .delay{animation-delay:.6s}.bot-energy .spin{animation:zy-spin 5s linear infinite;transform-origin:256px 256px}
@keyframes zy-float{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-12px);opacity:1}}
@keyframes zy-spin{to{transform:rotate(360deg)}}
@keyframes zy-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(210px)}}
@keyframes zy-ring{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes zy-dots{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
@keyframes zy-sleep{0%,100%{opacity:.4;transform:translate(0,0)}50%{opacity:1;transform:translate(10px,-20px)}}

@media(prefers-reduced-motion:reduce){.bot-energy .motion,.bot-energy .spin{animation:none!important}}
</style><circle cx="256" cy="256" r="155" fill="#151025" stroke="#a878ff" stroke-width="8"/><path class="motion" d="M282 116l-110 163h77l-22 119 118-177h-80z" fill="#ffd23f"/></svg>