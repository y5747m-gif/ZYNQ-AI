<svg xmlns="http://www.w3.org/2000/svg" class="zy-bot-svg bot-notification" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">تنبيه لطيف</title><desc id="desc">جرس ذهبي يتمايل عند وصول تنبيه جديد.</desc>
<style>
.bot-notification .motion{animation:zy-float 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bot-notification .delay{animation-delay:.6s}.bot-notification .spin{animation:zy-spin 5s linear infinite;transform-origin:256px 256px}
@keyframes zy-float{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-12px);opacity:1}}
@keyframes zy-spin{to{transform:rotate(360deg)}}
@keyframes zy-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(210px)}}
@keyframes zy-ring{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes zy-dots{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
@keyframes zy-sleep{0%,100%{opacity:.4;transform:translate(0,0)}50%{opacity:1;transform:translate(10px,-20px)}}
.bot-notification .motion{animation-name:zy-ring;transform-box:view-box;transform-origin:256px 140px}
@media(prefers-reduced-motion:reduce){.bot-notification .motion,.bot-notification .spin{animation:none!important}}
</style><circle cx="256" cy="256" r="160" fill="#151025" stroke="#a878ff" stroke-width="8"/><g class="motion"><path d="M170 310l22-42v-58a64 64 0 0 1 128 0v58l22 42z" fill="#ffd23f"/><circle cx="256" cy="337" r="23" fill="#5fd4ff"/><circle cx="256" cy="139" r="13" fill="#ffd23f"/></g></svg>