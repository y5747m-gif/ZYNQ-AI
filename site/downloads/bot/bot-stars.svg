<svg xmlns="http://www.w3.org/2000/svg" class="zy-bot-svg bot-stars" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">نجوم التفاعل</title><desc id="desc">ثلاث نجوم تتلألأ حول وجه مساعد سعيد.</desc>
<style>
.bot-stars .motion{animation:zy-float 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bot-stars .delay{animation-delay:.6s}.bot-stars .spin{animation:zy-spin 5s linear infinite;transform-origin:256px 256px}
@keyframes zy-float{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-12px);opacity:1}}
@keyframes zy-spin{to{transform:rotate(360deg)}}
@keyframes zy-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(210px)}}
@keyframes zy-ring{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes zy-dots{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
@keyframes zy-sleep{0%,100%{opacity:.4;transform:translate(0,0)}50%{opacity:1;transform:translate(10px,-20px)}}

@media(prefers-reduced-motion:reduce){.bot-stars .motion,.bot-stars .spin{animation:none!important}}
</style><rect x="156" y="170" width="200" height="165" rx="60" fill="#eeeaff"/><rect x="177" y="190" width="158" height="112" rx="38" fill="#151025"/><path d="M211 240l15-12 15 12m30 0l15-12 15 12" fill="none" stroke="#a878ff" stroke-width="10" stroke-linecap="round"/><path class="motion" d="M256 70l13 35 37 2-29 23 9 36-30-20-30 20 9-36-29-23 37-2z" fill="#ffd23f"/><circle class="motion delay" cx="116" cy="230" r="15" fill="#5fd4ff"/><circle class="motion" cx="398" cy="230" r="15" fill="#ff7ab8"/></svg>