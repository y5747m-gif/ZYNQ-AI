name: Android — build signed release

# Manual only. The owner supplies their own long-lived signing key as repository
# secrets. This builds downloadable signed files but does not publish to a store.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, for example 2.0.0'
        required: true
        type: string
      version_code:
        description: 'Positive integer greater than the previous release code'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate version and signing secrets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stereo-release.jks"
          test -s "$RUNNER_TEMP/stereo-release.jks"
      - name: Test and build signed APK and Play bundle
        working-directory: site/downloads/stereo-sound
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          STEREO_KEYSTORE_FILE: ${{ runner.temp }}/stereo-release.jks
          STEREO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          STEREO_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          STEREO_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease bundleRelease "-PstereoVersionName=$VERSION_NAME" "-PstereoVersionCode=$VERSION_CODE"
      - name: Verify release APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose site/downloads/stereo-sound/app/build/outputs/apk/release/app-release.apk'
      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: stereo-sound-android-signed-release
          path: |
            site/downloads/stereo-sound/app/build/outputs/apk/release/app-release.apk
            site/downloads/stereo-sound/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stereo-release.jks"
