name: Android — build installable test APK

on:
  push:
    paths:
      - 'site/downloads/stereo-sound/**'
      - 'site/public/index.html'
      - 'tests/site-check.js'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'site/downloads/stereo-sound/**'
      - 'site/public/index.html'
      - 'tests/site-check.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Test and build the Android APK
    # This runner includes Android SDK 36. Do not re-run setup-android: the
    # previous setup action failed before Gradle could build the app.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Check repository and standalone app resources
        run: node tests/site-check.js
      - name: Unit tests and APK
        working-directory: site/downloads/stereo-sound
        run: |
          if ! ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug > "$RUNNER_TEMP/android-build.log" 2>&1; then
            # Surface compiler/Gradle errors as check annotations as well as logs.
            grep -E '^e: |^FAILURE:|^\* What went wrong:|^> |^Caused by:| error:' "$RUNNER_TEMP/android-build.log" | head -n 25 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            tail -n 120 "$RUNNER_TEMP/android-build.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/android-build.log"
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose site/downloads/stereo-sound/app/build/outputs/apk/debug/app-debug.apk'
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: stereo-sound-android-test-apk
          path: site/downloads/stereo-sound/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
