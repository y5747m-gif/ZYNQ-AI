name: Android — build installable test APK

on:
  push:
    paths:
      - 'site/downloads/stereo-sound/**'
      - 'site/public/index.html'
      - 'tests/site-check.js'
      - 'tools/android-smoke.sh'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'site/downloads/stereo-sound/**'
      - 'site/public/index.html'
      - 'tests/site-check.js'
      - 'tools/android-smoke.sh'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Test and build the Android APK
    # This runner includes Android SDK 36. Do not re-run setup-android: the
    # previous setup action failed before Gradle could build the app.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Check repository and standalone app resources
        run: node tests/site-check.js
      - name: Unit tests and APK
        working-directory: site/downloads/stereo-sound
        run: |
          if ! ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug > "$RUNNER_TEMP/android-build.log" 2>&1; then
            # Surface compiler/Gradle errors as check annotations as well as logs.
            grep -E '^e: |^FAILURE:|^\* What went wrong:|^> |^Caused by:| error:' "$RUNNER_TEMP/android-build.log" | head -n 25 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            tail -n 120 "$RUNNER_TEMP/android-build.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/android-build.log"
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose site/downloads/stereo-sound/app/build/outputs/apk/debug/app-debug.apk'
      - name: Exercise release signing with a disposable test key
        working-directory: site/downloads/stereo-sound
        run: |
          set -eu
          trap 'rm -f "$RUNNER_TEMP/test-only-signing.p12"' EXIT
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/test-only-signing.p12" \
            -storetype PKCS12 -storepass android -keypass android -alias test-only \
            -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Disposable test key'
          export STEREO_KEYSTORE_FILE="$RUNNER_TEMP/test-only-signing.p12"
          export STEREO_KEYSTORE_PASSWORD=android STEREO_KEY_ALIAS=test-only STEREO_KEY_PASSWORD=android
          ./gradlew --no-daemon assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: stereo-sound-android-test-apk
          path: site/downloads/stereo-sound/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  device-smoke:
    name: Launch the app offline on Android 15
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: stereo-sound-android-test-apk
          path: ${{ runner.temp }}/stereo-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and smoke-test native app without network
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ runner.temp }}/stereo-apk/app-debug.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash tools/android-smoke.sh
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stereo-sound-emulator-screenshot
          path: ${{ runner.temp }}/stereo-smoke.png
          if-no-files-found: ignore
          retention-days: 7
