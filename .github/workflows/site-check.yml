name: Website and Arabic assistant checks
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'tools/gen_*.py'
      - 'package*.json'
      - 'vercel.json'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tests/**'
      - 'tools/gen_*.py'
      - 'package*.json'
      - 'vercel.json'
      - '.github/workflows/site-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-browser-screenshots
          path: .browser-test-artifacts/
          if-no-files-found: ignore
